[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Local transcription, visual analysis and media rendering dependencies for Veloce Engine"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
