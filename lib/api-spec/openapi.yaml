openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Veloce Engine content production API
servers:
  - url: /api
paths:
  /storage/report:
    get:
      operationId: getStorageReport
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Owner-only inventory; no deletion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageReport" }
        "401": { description: Sign in required }
  /storage/cleanup/history:
    get:
      operationId: listStorageCleanups
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        "200":
          description: Latest owner-only dry runs and outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageHistoryPage" }
  /storage/cleanup/history/{id}:
    get:
      operationId: getStorageCleanup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Owner-only paginated immutable manifest and current outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageReport" }
        "404": { description: Not found }
  /storage/cleanup/preview:
    post:
      operationId: previewStorageCleanup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageRetention" }
      responses:
        "200":
          description: Exact immutable removal manifest, valid for fifteen minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageReport" }
  /storage/cleanup/confirm:
    post:
      operationId: confirmStorageCleanup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageConfirmation" }
      responses:
        "200":
          description: Per-object cleanup outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageReport" }
        "409": { description: "Expired, changed, already used or invalid confirmation" }
  /autopilot/usage:
    get:
      operationId: getAutopilotUsage
      parameters:
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Private usage ledger and rolling job allowances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIUsageReport" }
        "401": { description: Sign in required }
    patch:
      operationId: updateAIUsageLimit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIUsageLimitInput" }
      responses:
        "200":
          description: Additional owner limit saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIUsageReport" }
        "400": { description: Invalid limit }
        "401": { description: Sign in required }
  /autopilot/render-budget:
    get:
      operationId: getRenderBudget
      responses:
        "200":
          description: Owner clip budget and fixed EST reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderBudget" }
    patch:
      operationId: updateRenderBudget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenderCapInput" }
      responses:
        "200":
          description: Owner daily cap saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderBudget" }
        "409": { description: New cap is below completed plus reserved clips }
  /autopilot/publish/{id}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getPublishingReview
      responses:
        "200":
          description: Current TikTok creator restrictions and specific content for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishingReview" }
    post:
      operationId: approvePublishingReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishingApproval" }
      responses:
        "200":
          description: Specific content approved for direct posting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionReceipt" }
  /autopilot/launch:
    post:
      operationId: launchAutopilot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutopilotInput" }
      responses:
        "202":
          description: Durably accepted before media or AI work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchReceipt" }
  /autopilot/swarm:
    get:
      operationId: getAutopilotSwarm
      responses:
        "200":
          description: Private recoverable source and clip progress
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SwarmJob" }
  /autopilot/jobs/{id}/action:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: controlAutopilotJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobAction" }
      responses:
        "200":
          description: Action persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionReceipt" }
  /autopilot/dub:
    post:
      operationId: cloneAndDub
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DubInput" }
      responses:
        "202":
          description: Unique ES and PT jobs accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchReceipt" }
  /autopilot/accounts:
    get:
      operationId: getAutopilotAccounts
      responses:
        "200":
          description: Separately authorized accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutopilotAccount" }
  /autopilot/accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateAutopilotAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountPreferences" }
      responses:
        "200":
          description: Preferences persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotAccount" }
    delete:
      operationId: disconnectAutopilotAccount
      responses:
        "204": { description: Disconnected without deleting media }
  /autopilot/schedule:
    get:
      operationId: getAutopilotSchedule
      responses:
        "200":
          description: Actual publishing queue and service status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotSchedule" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /studio/summary:
    get:
      operationId: getStudioSummary
      responses:
        "200":
          description: Workspace production summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioSummary" }
  /trending:
    get:
      operationId: listTrendingSources
      responses:
        "200":
          description: Curated example sources, not a live feed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrendingSource" }
  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Production batches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Batch queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getProject
      responses:
        "200":
          description: Batch progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      operationId: deleteProject
      responses:
        "204": { description: Deleted }
  /clips:
    get:
      operationId: listClips
      responses:
        "200":
          description: Clip vault
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Clip" }
  /clips/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateClip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClipUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clip" }
    delete:
      operationId: deleteClip
      responses:
        "204": { description: Deleted }
  /clips/{id}/regenerate:
    post:
      operationId: regenerateClip
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "202":
          description: Saved edits queued for regeneration; previous media stays playable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clip" }
        "409": { description: "No saved changes, unsupported historical clip, or regeneration already active" }
        "401": { description: Sign in required }
        "404": { description: Clip not found }
        "429": { description: Workspace queue limit reached }
  /exports:
    post:
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportInput" }
      responses:
        "200":
          description: Download link for ZIP containing available renders and metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportResult" }
  /campaigns:
    get:
      operationId: listCampaigns
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Campaign" }
    post:
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
  /campaigns/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
    delete:
      operationId: deleteCampaign
      responses:
        "204": { description: Deleted }
  /schedules:
    get:
      operationId: listSchedules
      responses:
        "200":
          description: Publishing plans; no automatic delivery without OAuth
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
    post:
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: Publishing draft saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
  /schedules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      operationId: deleteSchedule
      responses:
        "204": { description: Removed }
  /accounts:
    get:
      operationId: listPlatformAccounts
      responses:
        "200":
          description: Platform OAuth readiness
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformAccount" }
  /playbook:
    get:
      operationId: getPlaybook
      responses:
        "200":
          description: Operator training
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaybookLesson" }
  /playbook/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateLesson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonUpdate" }
      responses:
        "200":
          description: Training progress saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybookLesson" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthState" }
  /storage/uploads/finalize:
    post:
      operationId: finalizeMediaUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadFinalizeInput" }
      responses:
        "200":
          description: Verified private upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadFinalizeInput" }
  /settings/integrations:
    get:
      operationId: getSocialIntegrations
      responses:
        "200":
          description: Public configuration and secret-presence flags only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialIntegration" }
  /settings/integrations/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [youtube, tiktok, instagram, x] } }
    put:
      operationId: saveSocialIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialIntegrationInput" }
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialIntegration" }
    delete:
      operationId: disconnectSocialIntegration
      responses:
        "204": { description: Local account connection removed }
  /social/oauth/{provider}/start:
    get:
      operationId: beginSocialAuthorization
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [youtube, tiktok, instagram, x] } }
      responses:
        "302": { description: Redirect to platform consent after configuration checks }
        "401": { description: Login required }
        "409": { description: Configuration or approval missing }
  /social/oauth/{provider}/callback:
    get:
      operationId: finishSocialAuthorization
      description: Platform OAuth callback accepts provider-returned state, code and error query fields; state is single-use, owner-bound and expires after ten minutes.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [youtube, tiktok, instagram, x] } }
      responses:
        "302": { description: Return to Settings with authorization result; no credentials returned }
  /login:
    get:
      operationId: login
      parameters:
        - { name: returnTo, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to login }
  /logout:
    get:
      operationId: logout
      parameters:
        - { name: returnTo, in: query, schema: { type: string } }
      responses:
        "302": { description: Log out }
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileAuthInput" }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
components:
  schemas:
    StorageRetention:
      type: object
      required: [exportDays, intermediateDays]
      properties:
        exportDays: { type: [integer, "null"], minimum: 7, maximum: 3650 }
        intermediateDays: { type: [integer, "null"], minimum: 7, maximum: 3650 }
    StorageConfirmation:
      type: object
      required: [reportId, objectPaths, confirmation]
      properties:
        reportId: { type: string }
        objectPaths: { type: array, maxItems: 25, items: { type: string } }
        confirmation: { type: string }
    StorageTotal:
      type: object
      required: [category, bytes, count]
      properties:
        category: { type: string }
        bytes: { type: number }
        count: { type: integer }
    StorageObject:
      type: object
      required: [objectPath, category, bytes, createdAt, generation, metageneration, eligible, reason, outcome]
      properties:
        objectPath: { type: string }
        category: { type: string }
        bytes: { type: number }
        createdAt: { type: string }
        generation: { type: string }
        metageneration: { type: string }
        eligible: { type: boolean }
        reason: { type: string }
        outcome: { type: string }
    StorageReport:
      type: object
      required: [reportId, createdAt, expiresAt, status, policy, totals, objects, notice]
      properties:
        reportId: { type: string }
        createdAt: { type: string }
        expiresAt: { type: string }
        status: { type: string }
        policy: { $ref: "#/components/schemas/StorageRetention" }
        totals: { type: array, items: { $ref: "#/components/schemas/StorageTotal" } }
        objects: { type: array, items: { $ref: "#/components/schemas/StorageObject" } }
        notice: { type: string }
        nextCursor: { type: [string, "null"] }
        inventoryComplete: { type: boolean }
        lastReconciledAt: { type: [string, "null"] }
    StorageHistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/StorageReport" } }
        nextCursor: { type: [string, "null"] }
    AIUsageLimitInput:
      type: object
      required: [dailyRequestUnitLimit]
      properties:
        dailyRequestUnitLimit: { type: [integer, "null"], minimum: 0, maximum: 10000 }
    AIUsageMetrics:
      type: object
      required: [inputTokens, outputTokens, totalTokens, inputAudioTokens, outputAudioTokens, audioSeconds]
      properties:
        inputTokens: { type: [integer, "null"] }
        outputTokens: { type: [integer, "null"] }
        totalTokens: { type: [integer, "null"] }
        inputAudioTokens: { type: [integer, "null"] }
        outputAudioTokens: { type: [integer, "null"] }
        audioSeconds: { type: [number, "null"] }
    AIUsageEntry:
      type: object
      required: [id, jobId, projectId, sourceTitle, language, category, callKey, status, units, model, metrics, createdAt]
      properties:
        id: { type: integer }
        jobId: { type: integer }
        projectId: { type: integer }
        sourceTitle: { type: string }
        language: { type: string }
        category: { type: string, enum: [source, narration, es, pt] }
        callKey: { type: string }
        status: { type: string, enum: [started, done, uncertain, rejected] }
        units: { type: integer }
        model: { type: [string, "null"] }
        metrics: { $ref: "#/components/schemas/AIUsageMetrics" }
        createdAt: { type: string, format: date-time }
    AIUsageGroup:
      type: object
      required: [category, units, unknown, uncertain, metrics]
      properties:
        category: { type: string, enum: [source, narration, es, pt] }
        units: { type: integer }
        unknown: { type: integer }
        uncertain: { type: integer }
        metrics: { $ref: "#/components/schemas/AIUsageMetrics" }
    AIUsageReport:
      type: object
      required: [dailyRequestUnitLimit, usedUnits, remainingUnits, activeJobs, activeJobLimit, remainingActiveJobs, dailyJobs, dailyJobLimit, remainingDailyJobs, groups, entries, nextBefore, notice]
      properties:
        dailyRequestUnitLimit: { type: [integer, "null"] }
        usedUnits: { type: integer }
        remainingUnits: { type: [integer, "null"] }
        activeJobs: { type: integer }
        activeJobLimit: { type: integer }
        remainingActiveJobs: { type: integer }
        dailyJobs: { type: integer }
        dailyJobLimit: { type: integer }
        remainingDailyJobs: { type: integer }
        groups: { type: array, items: { $ref: "#/components/schemas/AIUsageGroup" } }
        entries: { type: array, items: { $ref: "#/components/schemas/AIUsageEntry" } }
        nextBefore: { type: [integer, "null"] }
        notice: { type: string }
    RenderCapInput:
      type: object
      required: [dailyRenderCap]
      properties:
        dailyRenderCap: { type: integer, minimum: 0, maximum: 1000, default: 15 }
    RenderBudget:
      type: object
      required: [dailyRenderCap, completed, reserved, remaining, resetAt, resetTimezone, pausedJobs]
      properties:
        dailyRenderCap: { type: integer }
        completed: { type: integer }
        reserved: { type: integer }
        remaining: { type: integer }
        resetAt: { type: string, format: date-time }
        resetTimezone: { type: string }
        pausedJobs: { type: integer }
    PublishingReview:
      type: object
      required: [title, caption, videoUrl, creatorName, privacyOptions, commentDisabled, duetDisabled, stitchDisabled, maxDuration, canPost]
      properties:
        title: { type: string }
        caption: { type: string }
        videoUrl: { type: string }
        creatorName: { type: string }
        privacyOptions: { type: array, items: { type: string } }
        commentDisabled: { type: boolean }
        duetDisabled: { type: boolean }
        stitchDisabled: { type: boolean }
        maxDuration: { type: number }
        canPost: { type: boolean }
    PublishingApproval:
      type: object
      required: [privacyLevel, disableComment, disableDuet, disableStitch, consent, brandContent, brandOrganic]
      properties:
        privacyLevel: { type: string, minLength: 1, maxLength: 80 }
        disableComment: { type: boolean }
        disableDuet: { type: boolean }
        disableStitch: { type: boolean }
        consent: { type: boolean }
        brandContent: { type: boolean }
        brandOrganic: { type: boolean }
    AutopilotInput:
      type: object
      required: [sources, idempotencyKey]
      properties:
        sources: { type: array, minItems: 1, maxItems: 5, items: { type: string, maxLength: 2048 } }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
    LaunchReceipt:
      type: object
      required: [jobIds, acceptedMs]
      properties:
        jobIds: { type: array, items: { type: integer } }
        acceptedMs: { type: number }
    JobAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [cancel, retry, acknowledge-uncertain] }
    ActionReceipt:
      type: object
      required: [message]
      properties:
        message: { type: string }
    DubInput:
      type: object
      required: [clipIds]
      properties:
        clipIds: { type: array, minItems: 1, maxItems: 20, items: { type: integer } }
    SwarmClip:
      type: object
      required: [index, status, language]
      properties:
        index: { type: integer }
        status: { type: string }
        language: { type: string }
        clip: { $ref: "#/components/schemas/Clip" }
    SwarmJob:
      type: object
      required: [id, projectId, sourceUrl, title, status, stage, progress, language, clips, notice, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        sourceUrl: { type: string }
        title: { type: string }
        status: { type: string }
        stage: { type: string }
        progress: { type: number }
        language: { type: string }
        error: { type: ["string", "null"] }
        failures: { type: integer }
        failureKind: { type: ["string", "null"] }
        retryAt: { type: ["string", "null"], format: date-time }
        notice: { type: string }
        createdAt: { type: string, format: date-time }
        clips: { type: array, items: { $ref: "#/components/schemas/SwarmClip" } }
    AccountPreferences:
      type: object
